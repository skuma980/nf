name: Export Aspen Mesh images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AM_TAG: 1.21.6-am1
      AM_REPO: artifacts.aspenmesh.io
      DOCKER_DEFAULT_PLATFORM: linux/amd64

    steps:
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Log in to Aspen Mesh
        env:
          REGISTRY_KEY: ${{ secrets.ASPEN_REGISTRY_KEY_B64 }}
        run: |
          set -euo pipefail

          if [ -z "$REGISTRY_KEY" ]; then
            echo "Missing ASPEN_REGISTRY_KEY_B64 secret"
            exit 1
          fi

          printf '%s' "$REGISTRY_KEY" |
            helm registry login "$AM_REPO" \
              --username _json_key_base64 --password-stdin

          printf '%s' "$REGISTRY_KEY" |
            docker login "$AM_REPO" \
              --username _json_key_base64 --password-stdin

      - name: Download platform package
        run: |
          set -euo pipefail

          helm pull \
            "oci://$AM_REPO/release/f5-aspen-mesh-platform-linux" \
            --version "$AM_TAG"

          tar -xzf "f5-aspen-mesh-platform-linux-$AM_TAG.tgz"

      - name: Pull Aspen Mesh charts and images
        run: |
          set -euo pipefail

          docker image ls --format '{{.Repository}}:{{.Tag}}' |
            LC_ALL=C sort -u > "$RUNNER_TEMP/images-before.txt"

          cd "f5-aspen-mesh-platform-linux-$AM_TAG"
          ./tools/pull-charts-and-images.sh

      - name: Export downloaded images
        run: |
          set -euo pipefail
          mkdir -p output

          docker image ls --format '{{.Repository}}:{{.Tag}}' |
            LC_ALL=C sort -u > "$RUNNER_TEMP/images-after.txt"

          LC_ALL=C comm -13 \
            "$RUNNER_TEMP/images-before.txt" \
            "$RUNNER_TEMP/images-after.txt" |
            sed '/<none>/d' > output/images.txt

          mapfile -t images < output/images.txt

          if [ "${#images[@]}" -eq 0 ]; then
            echo "No newly downloaded images found"
            exit 1
          fi

          docker save "${images[@]}" |
            gzip > "output/aspen-mesh-$AM_TAG-images.tar.gz"

          cd output
          sha256sum "aspen-mesh-$AM_TAG-images.tar.gz" > SHA256SUMS

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: aspen-mesh-1.21.6-am1-images
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload platform package and Helm charts
        uses: actions/upload-artifact@v4
        with:
          name: aspen-mesh-1.21.6-am1-platform-and-charts
          path: |
            f5-aspen-mesh-platform-linux-1.21.6-am1.tgz
            f5-aspen-mesh-platform-linux-1.21.6-am1/**/*.tgz
          if-no-files-found: error
          retention-days: 3

      - name: Log out
        if: always()
        run: |
          docker logout "$AM_REPO" || true
          helm registry logout "$AM_REPO" || true
